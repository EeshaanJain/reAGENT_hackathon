# Example model_contract.yaml (== MODELSPEC.json) -- a filled-in ladder-rung-1 (API-native)
# example, in the style of a Chem-PerturBridge-class method: a pretrained compound representation
# feeding a ridge/MLP head that predicts DE directly. This is what Cecilia's Stage 3 hands off;
# everything here downstream (harness/synthesize_adapter.py, the Gauntlet) is written to consume
# exactly this shape. See schemas/model_contract.schema.json for the structural + citation rules.
#
# NOTE: citations below point at line numbers in a hypothetical vendored paper/repo snapshot that
# doesn't exist in this repo -- this file is a worked example for exercising the harness, not a
# real handoff. `harness/contract.py load_contract()` validates its *shape* and *citation syntax*;
# resolving citations against real source material needs paper_pack_dir/repo_dir, which only
# exist once Cecilia's Stage 0/2 have actually run.

