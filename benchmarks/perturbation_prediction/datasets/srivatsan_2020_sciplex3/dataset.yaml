ingest:
  matrix_chunk_rows: 10000000
  expected_treated_compounds: 188
  required_pdata_columns:
    - cell
    - n.umi
    - hash_umis_W
    - top_to_second_best_ratio_W
    - top_oligo_W
    - hash_umis_P
    - top_to_second_best_ratio_P
    - top_oligo_P
    - rt_well
    - cell_type
    - replicate
    - time_point
    - catalog_number
    - dose
    - vehicle
    - product_name
  control:
    source_catalog_number: S0000
    output_label: control
  exact_identifier_fallback:
    cas_number: 4548-34-9
    expected_inchikey: AELCINSCMGFISI-BDAKNGLRSA-N
    source: pubchem_exact_cas_smiles_rdkit
    expected_rows: 1
  single_cell_protocol:
    chemistry: sci-Plex nuclear hashing with three-level sci-RNA-seq (sci-RNA-seq3)
    capture_orientation: 3prime
  source_files:
